[project]
name = "flux-agent-manager"
version = "0.1.0"
description = "Flux Agent Manager — gRPC server for Claude Agent SDK task execution"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "protobuf>=4.25.0",
]

[project.scripts]
flux-agent-manager = "server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
